# On merge to main: applies non-production flags first, then waits for a
# reviewer to approve before applying production.
#
# The admin key is only in the "non-production" and "production" GitHub Environments,
# both limited to main, so no pull request workflow can read it.
# Self-hosted runner: see README for why.

name: FlagOps apply

on:
  push:
    branches: [main]
    paths:
      - "flags/**"
  workflow_dispatch: # run it by hand to apply the current main again

permissions:
  contents: read

jobs:
  apply-non-production:
    runs-on: self-hosted
    timeout-minutes: 15
    environment: non-production
    # One group per job, so non-production never waits behind an earlier run's
    # production approval. A newer pending run replaces an older one; it applies
    # the latest main, which includes the older change.
    concurrency: flagops-apply-non-production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: Akash-016/flagops@cd63fc198ffee4ca82dca8d98e1d63760ea709b3 # v1.5.0, pinned: this job holds the admin key
        with:
          command: apply
          environments: Development, Staging # list every non-production environment here
          allow-production: "false" # refuse, changing nothing, if a production-like one slips in
          api-url: ${{ vars.FLAGSMITH_API_URL }}
          admin-key: ${{ secrets.FLAGSMITH_ADMIN_KEY }}
      # What the production job will change, in this run's summary, so the reviewer sees it
      # before releasing Production. It includes any dashboard change that apply would undo.
      - name: Production plan for the reviewer
        uses: Akash-016/flagops@cd63fc198ffee4ca82dca8d98e1d63760ea709b3 # v1.5.0
        with:
          command: plan
          skip-environments: Development, Staging # everything else, including environments added later
          comment: "false"
          timeout: 120
          api-url: ${{ vars.FLAGSMITH_API_URL }}
          admin-key: ${{ secrets.FLAGSMITH_ADMIN_KEY }}

  apply-production:
    needs: apply-non-production
    runs-on: self-hosted
    timeout-minutes: 15
    environment: production # waits here for a required reviewer
    concurrency: flagops-apply-production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: Akash-016/flagops@cd63fc198ffee4ca82dca8d98e1d63760ea709b3 # v1.5.0, pinned: this job holds the admin key
        with:
          command: apply
          skip-environments: Development, Staging # everything else, including environments added later
          api-url: ${{ vars.FLAGSMITH_API_URL }}
          admin-key: ${{ secrets.FLAGSMITH_ADMIN_KEY }}
