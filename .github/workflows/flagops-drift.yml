# Checks once a day whether someone changed flags outside Git (for example in the
# Flagsmith dashboard). Opens an issue listing the drift, and closes it once fixed.
# Reads flags with read-only server-side keys, never the admin key.

name: FlagOps drift check

on:
  schedule:
    - cron: "17 6 * * *" # every day at 06:17 UTC
  workflow_dispatch: # also allows a manual run from the Actions tab

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5
      - uses: Akash-016/flagops@v1
        with:
          command: drift
          api-url: ${{ vars.FLAGSMITH_API_URL }}
          environment-keys: ${{ secrets.FLAGSMITH_ENVIRONMENT_KEYS }}
