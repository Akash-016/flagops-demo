# Checks the flag files offline on every pull request, on GitHub's own runners.
# Runs on every pull request so "validate" can be a required status check.

name: FlagOps validate

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: Akash-016/flagops@d33aa9cd64a1eb1755f0abe6c3b9fdba9e230d1c # v1.1.7
        with:
          command: validate
