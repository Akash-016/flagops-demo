# Checks the flag files offline on every pull request, on GitHub's own runners.
# Runs on every pull request so "validate" can be a required status check.

name: FlagOps validate

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: Akash-016/flagops@cd63fc198ffee4ca82dca8d98e1d63760ea709b3 # v1.5.0
        with:
          command: validate
