# Checks the flag files offline on every pull request, on GitHub's own runners.
# Runs on every pull request so "validate" can be a required status check.

name: FlagOps validate

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: Akash-016/flagops@ba07fc5f509e30548cba41e8352bc7301dbd0c6e # v1.1.4
        with:
          command: validate
