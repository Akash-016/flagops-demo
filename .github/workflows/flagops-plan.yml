# Posts the FlagOps plan on pull requests that change flags/.
# Reads flags with read-only server-side keys, never the admin key.
# Self-hosted runner: see README for why. Never runs for fork pull requests.
# flagops-validate.yml checks the files on GitHub's own runners.

name: FlagOps plan

on:
  pull_request:
    paths:
      - "flags/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: Akash-016/flagops@4726e2a3b1cb098e55490dba3c1ba92aeab3035f # v1.3.1
        with:
          command: plan
          timeout: 120 # Flagsmith runs on a laptop here; it can be slow
          api-url: ${{ vars.FLAGSMITH_API_URL }}
          environment-keys: ${{ secrets.FLAGSMITH_ENVIRONMENT_KEYS }}
