# Demo setup: Flagsmith runs on the maintainer's machine, so plan uses a self-hosted runner.
# flagops-validate.yml checks the files on GitHub's own runners.

name: FlagOps plan

on:
  pull_request:
    paths:
      - "flags/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5
      - uses: Akash-016/flagops@main
        with:
          command: plan
          api-url: ${{ vars.FLAGSMITH_API_URL }}
          admin-key: ${{ secrets.FLAGSMITH_ADMIN_KEY }}
