# Posts the FlagOps plan on pull requests that change flags/.
# Reads flags with read-only server-side keys, never the admin key.
# Self-hosted runner: see README for why. Never runs for fork pull requests.
# flagops-validate.yml checks the files on GitHub's own runners.

name: FlagOps plan

on:
  pull_request:
    paths:
      - "flags/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5
      - uses: Akash-016/flagops@v1
        with:
          command: plan
          api-url: ${{ vars.FLAGSMITH_API_URL }}
          environment-keys: ${{ secrets.FLAGSMITH_ENVIRONMENT_KEYS }}
